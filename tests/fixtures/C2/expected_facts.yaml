# Subclass query assertions (cat 8.3):
subclass_queries:
  title_query_returns_all_subclasses:
    query: "SELECT * FROM Title"
    expected_classes: [Movie, Series, Episode, Game]

# Polymorphic Identifier assertions (cat 4.4, 8.1, 8.2):
polymorphic_identifiers:
  - identifier_id: id_imdb_identifiers_00000
    entity_class: Movie
    expected: resolves_to_movie_canonical_id
  - identifier_id: id_imdb_identifiers_00005
    entity_class: Series
    expected: resolves_to_series_canonical_id

# Discriminator routing (cat 1.14):
discriminator_routing:
  - source: imdb_series
    kind_value: movie
    expected: routed_to_Movie_class
  - source: wikidata_series
    kind_value: exclude
    expected: dropped_wildcard

# Deep derivation chain (cat 5.4):
deep_chains:
  episode_chain:
    path: Episode.parent_series.creator.country.name
    expected: string_country_name
