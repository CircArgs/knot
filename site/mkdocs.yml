site_name: knot — technical design
site_description: Design write-up for knot, a knowledge-graph + ontology platform for one team.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

plugins:
  - search

nav:
  - Overview: index.md
  - Architecture overview: architecture-overview.md
  - 1. Why knot exists:
      - Overview: 1-why/index.md
      - The hard problems: 1-why/the-hard-problems.md
      - Constraints and posture: 1-why/constraints-and-posture.md
      - Why existing systems don't suffice: 1-why/why-existing-systems.md
  - 2. Architectural commitments:
      - Overview: 2-commitments/index.md
      - Foundation: 2-commitments/1-foundation.md
      - The DI seam: 2-commitments/2-the-di-seam.md
      - Data and resolution: 2-commitments/3-data-and-resolution.md
      - Quality and publish: 2-commitments/4-quality-and-publish.md
      - Pipeline and sources: 2-commitments/5-pipeline-and-sources.md
      - Execution delegation: 2-commitments/6-execution-delegation.md
