[project]
name = "hitch"
version = "0.1.0"
description = "End-to-end reference app on top of knot (substrate) + knot_graphql"
requires-python = ">=3.11"
dependencies = [
    "knot",                    # local sibling package (installed -e)
    "knot_graphql",            # ditto
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "ariadne>=0.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "temporalio>=1.7",
    "sentence-transformers>=2.7",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hitch"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
