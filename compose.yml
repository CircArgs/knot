services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knot-postgres
    environment:
      POSTGRES_USER: knot
      POSTGRES_PASSWORD: knot
      POSTGRES_DB: knot
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knot -d knot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
    name: knot_knot_pg_data
