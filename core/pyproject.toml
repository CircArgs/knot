[project]
name = "knot"
dynamic = ["version"]
description = "knot — reflective ontology compiler library (spec → DDL + GraphQL + Pydantic validators + constraint SQL)"
requires-python = ">=3.11"
dependencies = [
    # Typed metaschema + serialization.
    "pydantic>=2.5",
    # JCS canonicalization for content hashing.
    "jcs>=0.2",
    # SQL parsing + AST rewriting for constraint bodies + spec-aware
    # references inside Constraint.body and DefinedClass.definition.
    "sqlglot>=25.0",
    # Compiler emits psycopg.sql.Composable fragments (parameterised
    # DDL + predicate + order-by SQL). The runtime that executes them
    # provides the connection; the library only constructs them.
    "psycopg[binary]>=3.1",
    # Compiler emits Strawberry types and a Schema object for the host
    # GraphQL server to mount.
    "strawberry-graphql>=0.200",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit test (no I/O)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long — formatter handles wrapping
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = "^(tests)"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "knot/__version__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "knot",
]
