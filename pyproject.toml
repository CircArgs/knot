[project]
name = "knot"
version = "0.1.0"
description = "knot — reflective ontology compiler (Python prototype)"
requires-python = ">=3.11"
dependencies = [
    # AST parsing + rewriting of SQL strings inside Constraint.body,
    # VirtualClass.definition, and SourceBinding.mappings.
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]
notebook = [
    "marimo>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: pure unit test (no I/O)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — formatter handles wrapping
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
