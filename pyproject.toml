[project]
name = "knot"
version = "0.0.0"
description = "Knowledge graph orchestration and entity resolution toolkit"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
runtime = [
    "sqlglot>=23",
    "pyiceberg>=0.6",
    "duckdb>=1.0",
    "jcs>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rapidfuzz>=3.0",
]
dev = [
    "mkdocs-material",
    "pymdown-extensions",
]
test = [
    "pytest>=8",
    "pytest-asyncio",
    "psycopg[binary]>=3.1",
    "neo4j>=5.20",
    "pyyaml>=6.0",
]
notebook = [
    "marimo>=0.10",
    "pandas>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/knot",
    "src/knot_demo_a1",
    "src/knot_demo_b2",
    "src/knot_demo_c2",
]
