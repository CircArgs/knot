[project]
name = "knot"
version = "0.1.0"
description = "knot — reflective ontology compiler (Python prototype)"
requires-python = ">=3.11"
# Zero runtime dependencies. The semantic builder (knot.expr) and
# structured SourceMap shape mean knot no longer parses any user-input
# SQL — everything that needed sqlglot at runtime has been replaced by
# typed Python construction. sqlglot stays in [dev] for tests that
# parse emitted SQL to assert it's well-formed postgres.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "sqlglot>=25.0",
    "psycopg[binary]>=3.1",
]
notebook = [
    "marimo>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: pure unit test (no I/O)",
    "integration: requires a live postgres on $KNOT_PG_URL (default jdbc:postgresql://localhost:5433/knot via the compose service)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — formatter handles wrapping
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
