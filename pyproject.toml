[project]
name = "knot"
version = "0.1.0"
description = "knot — reflective ontology compiler (Python prototype)"
requires-python = ">=3.11"
# Zero runtime dependencies. The semantic builder (knot.expr) and
# structured SourceMap shape mean knot no longer parses any user-input
# SQL — everything that needed sqlglot at runtime has been replaced by
# typed Python construction. sqlglot stays in [dev] for tests that
# parse emitted SQL to assert it's well-formed postgres.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "sqlglot>=25.0",
    "psycopg[binary]>=3.1",
]
notebook = [
    "marimo>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knot", "knot_graphql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: pure unit test (no I/O)",
    "integration: requires a live postgres on $KNOT_PG_URL (default jdbc:postgresql://localhost:5433/knot via the compose service)",
]

[tool.ruff]
target-version = "py311"
# Match black's default. Override per-file with # noqa: E501 when truly
# unavoidable (long string literals etc).
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — formatter wraps; manual long lines are fine
]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files re-export names from submodules. Without
# __all__ (we removed it), ruff sees those imports as "unused" — but
# they're the package's public surface declaration. The underscore
# convention marks private; non-underscored re-exports are public.
"__init__.py" = ["F401"]
# Marimo notebooks: bare expressions at cell end are how cells emit
# their displayed value (df / spec / SCHEMA / …). B018 ("useless
# expression") flags them; the rule doesn't understand marimo's
# cell semantics. E402 likewise — imports are cell-scoped, not
# module-scoped, so mid-file imports are normal.
"notebooks/*.py" = ["B018", "E402"]
"notebooks/*.ipynb" = ["B018", "E402"]

[tool.ruff.lint.isort]
# isort profile=black parity:
#   * combine ``from X import a as A, b as B`` into one line
#   * sort within sections, alphabetical
#   * knot is first-party — its own block, after stdlib + third-party
known-first-party = ["knot"]
combine-as-imports = true
force-sort-within-sections = false
order-by-type = true

[tool.ruff.format]
# Black-compatible defaults made explicit so config drift is obvious.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

# ---------------------------------------------------------------------------
# Type checker
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["knot"]
# Pragmatic strictness: catch real bugs without forcing every dynamic
# accessor (``_ColAccess.__getattr__``, ``FkRef.__getattr__``,
# ``_ThisAccess.__getattr__``) to invent return types it can't promise.
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
disallow_incomplete_defs = true
# Singledispatch-registered handlers in expr_sql.py / query_sql.py are
# intentionally untyped on the first arg (dispatch happens via the
# decorator's class argument). Mypy can see through them but not all
# the way; the relaxed default keeps it quiet on those.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Tests use the dataclasses directly; we don't ship type-checked tests.
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
# sqlglot doesn't ship a py.typed marker.
module = "sqlglot"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Marimo notebooks use untyped cells; not in the lib surface.
module = "marimo"
ignore_missing_imports = true
